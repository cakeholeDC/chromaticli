<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>chromaticli — preview gallery</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; padding: 24px;
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: Canvas; color: CanvasText;
  }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 4px; }
  p.meta { margin: 0 0 24px; opacity: 0.65; font-size: 13px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 18px;
  }
  .theme-section { margin: 28px 0; }
  .theme-section h2 { font-size: 16px; margin: 0 0 12px; }
  .card { margin: 0; }
  .card img { display: block; width: 100%; height: auto; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.15); }
  .card figcaption { font-size: 12px; margin-top: 6px; line-height: 1.4; }
  .card figcaption code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
</style>
</head>
<body>
  <h1>chromaticli — preview gallery</h1>
  <p class="meta">23 themes. Generated from <code>themes.json</code> via <code>scripts/generate-preview.py</code>.</p>
  <section class="theme-section">
    <h2>Core</h2>
    <div class="grid">
      <figure class="card">
        <img src="../web/public/gallery/themes/red.svg" alt="red" loading="lazy"/>
        <figcaption><code>red</code></figcaption>
      </figure>
      <figure class="card">
        <img src="../web/public/gallery/themes/orange.svg" alt="orange" loading="lazy"/>
        <figcaption><code>orange</code></figcaption>
      </figure>
      <figure class="card">
        <img src="../web/public/gallery/themes/yellow.svg" alt="yellow" loading="lazy"/>
        <figcaption><code>yellow</code></figcaption>
      </figure>
      <figure class="card">
        <img src="../web/public/gallery/themes/green.svg" alt="green" loading="lazy"/>
        <figcaption><code>green</code></figcaption>
      </figure>
      <figure class="card">
        <img src="../web/public/gallery/themes/blue.svg" alt="blue" loading="lazy"/>
        <figcaption><code>blue</code></figcaption>
      </figure>
      <figure class="card">
        <img src="../web/public/gallery/themes/indigo.svg" alt="indigo" loading="lazy"/>
        <figcaption><code>indigo</code></figcaption>
      </figure>
      <figure class="card">
        <img src="../web/public/gallery/themes/violet.svg" alt="violet" loading="lazy"/>
        <figcaption><code>violet</code></figcaption>
      </figure>
    </div>
  </section>

        <img src="../web/public/gallery/themes/light-yellow.svg" alt="light-yellow" loading="lazy"/>

    </div>
  </section>
  <section class="theme-section">
